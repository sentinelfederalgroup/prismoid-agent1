name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GO_VERSION: "1.26"

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'apps/desktop/src-tauri/**'
            go:
              - 'apps/desktop/src-sidecar/**'
            typescript:
              - 'apps/desktop/src/**'
              - 'apps/desktop/package.json'
              - 'apps/desktop/bun.lock'
              - 'apps/desktop/tsconfig.json'
              - 'apps/desktop/vite.config.*'
              - 'apps/desktop/eslint.config.*'

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: "./apps/desktop/src-tauri -> target"
          cache-on-failure: true

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/desktop/src-sidecar/go.sum

      - name: Build Go sidecar
        working-directory: apps/desktop/src-sidecar
        run: |
          target=$(rustc -vV | grep host | cut -d' ' -f2)
          ext=""
          [[ "$target" == *windows* ]] && ext=".exe"
          go build -o "../src-tauri/binaries/sidecar-${target}${ext}" ./cmd/sidecar

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: cargo-llvm-cov,cargo-audit

      - name: Test with coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path coverage-rust.lcov

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/desktop/src-tauri/coverage-rust.lcov
          flags: rust

      - name: Audit
        # RUSTSEC-2026-0097: unsound `rand::rng()` only triggers with a custom
        # logger we don't install; pulled in transitively via tauri/keyring.
        run: cargo audit --ignore RUSTSEC-2026-0097

  go:
    name: Go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop/src-sidecar
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/desktop/src-sidecar/go.sum

      - name: Lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6 && golangci-lint run

      - name: Vulnerability check
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && govulncheck ./...

      - name: Test with coverage
        run: go test -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/desktop/src-sidecar/coverage.txt
          flags: go

  typescript:
    name: TypeScript
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bunx eslint .

      - name: Format check
        run: bunx prettier --check .

      - name: Test with coverage
        run: bunx vitest run --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/desktop/coverage/lcov.info
          flags: typescript
