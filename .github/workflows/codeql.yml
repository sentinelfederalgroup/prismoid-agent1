name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/src-sidecar/**"
      - "apps/desktop/src/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/src-sidecar/**"
      - "apps/desktop/src/**"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
