name: Stale

on:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Close Stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-issue-message: "This issue has been inactive for 60 days. It will be closed in 14 days unless there is new activity."
          stale-pr-message: "This PR has been inactive for 30 days. It will be closed in 7 days unless there is new activity."
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned,security"
